<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<meta name="color-scheme" content="dark">
<title>Falling Block</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section class="hold box panel">
    <h4>Hold</h4>
    <canvas id="hold" width="80" height="80"></canvas>
  </section>

  <section class="stats panel" aria-live="polite">
    <div class="brand"><i></i>FALLING<span>BLOCK</span></div>
    <div class="stat main"><small>Pontos</small><b id="score">0</b></div>
    <div class="stat"><small>Recorde</small><b id="best">0</b></div>
    <div class="stat"><small>Nível</small><b id="level">1</b></div>
    <div class="stat lines"><small>Linhas</small><b id="lines">0</b></div>
  </section>

  <section class="next box panel">
    <h4>Next</h4>
    <canvas id="next" width="80" height="240"></canvas>
  </section>

  <div class="stage">
    <div class="board panel">
      <canvas id="c" width="300" height="600"></canvas>
      <div id="ov">
        <h2 id="ovt">Falling Block</h2>
        <p id="ovp">Setas ou toque para jogar</p>
        <button class="btn cta" id="go">Jogar</button>
      </div>
    </div>
  </div>

  <section class="keys panel" aria-label="Teclas">
    <div><span>Mover</span><span><kbd>←</kbd><kbd>→</kbd></span></div>
    <div><span>Girar</span><span><kbd>↑</kbd><kbd>X</kbd></span></div>
    <div><span>Girar ↺</span><kbd>Z</kbd></div>
    <div><span>Descer</span><kbd>↓</kbd></div>
    <div><span>Queda</span><kbd>Espaço</kbd></div>
    <div><span>Guardar</span><kbd>C</kbd></div>
    <div><span>Pausa</span><kbd>P</kbd></div>
  </section>

  <nav class="ctrl" aria-label="Controles">
    <div class="move">
      <button class="btn" id="bl" aria-label="Esquerda"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="btn" id="bd" aria-label="Descer"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
      <button class="btn" id="br" aria-label="Direita"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="btn pause" id="pause" aria-label="Pausar"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg><span class="lbl">Pausa</span></button>
    <div class="act">
      <button class="btn amber" id="bu" aria-label="Girar"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
      <button class="btn mag" id="drop" aria-label="Queda rápida"><svg viewBox="0 0 24 24"><path d="M6 4l6 6 6-6M6 11l6 6 6-6M6 20h12"/></svg></button>
      <button class="btn" id="bh" aria-label="Guardar"><span class="hl">HOLD</span></button>
    </div>
  </nav>

</div>
<script src="script.js"></script>
</body>
</html>
